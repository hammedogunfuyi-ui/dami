<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dami Project - Wallet</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<style>
  body { font-family: 'Inter', sans-serif; }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
.dark-glass { backdrop-filter: blur(16px); background: rgba(17, 24, 39, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 14px; }
  th { background-color: rgba(79, 70, 229, 0.3); font-weight: 700; color: #a5b4fc; }
  tr:hover { background-color: rgba(79, 70, 229, 0.2); transition: 0.3s; }
  button { cursor: pointer; transition: all 0.3s; }
  button:hover { transform: translateY(-2px); }
.gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%); }
.avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
.balance-card { background: rgba(79, 70, 229, 0.2); border: 1px solid rgba(129, 140, 248, 0.3); }
</style>
</head>
<body class="gradient-bg min-h-screen text-white">

<!-- LOGIN PAGE -->
<div id="loginPage">
  <div class="flex items-center justify-center min-h-screen p-4">
    <div class="dark-glass p-10 rounded-3xl shadow-2xl w-96">
      <h2 class="text-4xl font-extrabold text-center mb-2 bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">Dami Wallet</h2>
      <input id="loginEmail" type="email" placeholder="Email" class="bg-gray-900/50 border-2 border-gray-700 p-3 w-full mb-3 rounded-xl focus:border-indigo-500 outline-none">
      <input id="loginPassword" type="password" placeholder="Password" class="bg-gray-900/50 border-2 border-gray-700 p-3 w-full mb-4 rounded-xl focus:border-indigo-500 outline-none">
      <button onclick="login()" class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white p-3 w-full rounded-xl font-bold mb-3 shadow-lg">Login</button>
      <button onclick="showSignup()" class="bg-gray-700 hover:bg-gray-600 text-white p-3 w-full rounded-xl font-bold mb-3">Create Account</button>
      <div class="flex items-center my-3"><div class="flex-1 h-px bg-gray-700"></div><span class="px-2 text-gray-500 text-sm">OR</span><div class="flex-1 h-px bg-gray-700"></div></div>
      <button onclick="googlePopupLogin()" class="bg-white text-gray-800 p-3 w-full rounded-xl font-bold hover:bg-gray-200 flex items-center justify-center gap-2">Sign in with Google</button>
      <p id="loginErr" class="text-red-400 text-center mt-3 text-sm"></p>
    </div>
  </div>
</div>

<!-- SIGNUP PAGE -->
<div id="signupPage" style="display:none">
  <div class="flex items-center justify-center min-h-screen p-4">
    <div class="dark-glass p-10 rounded-3xl shadow-2xl w-96">
      <h2 class="text-4xl font-extrabold text-center mb-2 bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">Join Us</h2>
      <input id="signupName" type="text" placeholder="Full Name" class="bg-gray-900/50 border-2 border-gray-700 p-3 w-full mb-3 rounded-xl focus:border-indigo-500 outline-none">
      <input id="signupEmail" type="email" placeholder="Email Address" class="bg-gray-900/50 border-2 border-gray-700 p-3 w-full mb-3 rounded-xl focus:border-indigo-500 outline-none">
      <input id="signupPassword" type="password" placeholder="Password" class="bg-gray-900/50 border-2 border-gray-700 p-3 w-full mb-4 rounded-xl focus:border-indigo-500 outline-none">
      <button onclick="signup()" class="bg-gradient-to-r from-green-600 to-emerald-600 text-white p-3 w-full rounded-xl font-bold mb-3 shadow-lg">Create Account</button>
      <button onclick="showLogin()" class="bg-gray-700 hover:bg-gray-600 text-white p-3 w-full rounded-xl font-bold">Back to Login</button>
      <p id="signupErr" class="text-red-400 text-center mt-3 text-sm"></p>
    </div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashPage" style="display:none">
  <nav class="dark-glass shadow-2xl p-4 sticky top-0">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-extrabold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">Dami Wallet</h1>
      <div class="flex gap-3 items-center">
        <img id="navAvatar" src="https://ui-avatars.com/api/?name=U&background=4F46E5&color=fff" class="avatar">
        <button onclick="showProfile()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-xl font-semibold">Profile</button>
        <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded-xl font-semibold">Logout</button>
      </div>
    </div>
  </nav>

  <div class="p-8 max-w-7xl mx-auto">
    <div id="dashboardContent">
      <h2 class="text-4xl font-bold mb-6">Welcome <span id="userEmail"></span> 👋</h2>

      <!-- BALANCE CARDS FOR ALL USERS -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div class="balance-card p-4 rounded-2xl"><p class="text-gray-400 text-sm">USD Balance</p><p id="balUSD" class="text-2xl font-bold text-green-400">$0.00</p><button onclick="openDepositModal('USD')" class="text-xs bg-green-600 px-3 py-1 rounded mt-2">Deposit</button></div>
        <div class="balance-card p-4 rounded-2xl"><p class="text-gray-400 text-sm">USDT Balance</p><p id="balUSDT" class="text-2xl font-bold text-teal-400">0.00</p><button onclick="openDepositModal('USDT')" class="text-xs bg-teal-600 px-3 py-1 rounded mt-2">Deposit</button></div>
        <div class="balance-card p-4 rounded-2xl"><p class="text-gray-400 text-sm">BTC Balance</p><p id="balBTC" class="text-2xl font-bold text-orange-400">0.0000</p><button onclick="openDepositModal('BTC')" class="text-xs bg-orange-600 px-3 py-1 rounded mt-2">Deposit</button></div>
        <div class="balance-card p-4 rounded-2xl"><p class="text-gray-400 text-sm">ETH Balance</p><p id="balETH" class="text-2xl font-bold text-blue-400">0.0000</p><button onclick="openDepositModal('ETH')" class="text-xs bg-blue-600 px-3 py-1 rounded mt-2">Deposit</button></div>
      </div>

      <!-- ADMIN ONLY -->
      <div id="adminContent" style="display:none">
        <div class="dark-glass p-6 rounded-2xl shadow-2xl">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-2xl font-bold">All Users</h3>
            <input id="searchInput" onkeyup="searchUsers()" type="text" placeholder="Search..." class="bg-gray-900/50 border-2 border-gray-700 p-2 rounded-lg w-64">
          </div>
          <div class="overflow-x-auto">
            <table>
              <thead><tr><th>#</th><th>User</th><th>USD</th><th>USDT</th><th>BTC</th><th>ETH</th><th>Action</th></tr></thead>
              <tbody id="usersTable"><tr><td colspan="7" class="text-center p-4">Loading...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- NORMAL USER -->
      <div id="userContent" style="display:none">
        <div class="dark-glass p-10 rounded-2xl shadow-2xl text-center">
          <h3 class="text-3xl font-bold text-gray-200">Your Wallet is Ready</h3>
          <p class="text-gray-400 mt-2">Use the deposit buttons above to add funds</p>
        </div>
      </div>
    </div>

    <!-- PROFILE PAGE -->
    <div id="profileContent" style="display:none">
      <button onclick="showDashboard()" class="mb-4 text-indigo-400 hover:underline">← Back to Dashboard</button>
      <div class="dark-glass p-10 rounded-2xl shadow-2xl max-w-2xl mx-auto">
        <h3 class="text-3xl font-bold mb-6">My Profile</h3>
        <div class="flex items-center gap-4 mb-4"><img id="profileAvatar" src="https://ui-avatars.com/api/?name=U&background=4F46E5&color=fff" class="avatar w-20 h-20"><input type="file" id="avatarUpload" accept="image/*" onchange="uploadAvatar()" class="text-sm"></div>
        <div class="space-y-4">
          <div><label class="text-gray-400 text-sm">Full Name</label><input id="profileName" type="text" class="bg-gray-900/50 border-2 border-gray-700 p-3 w-full mt-1 rounded-xl focus:border-indigo-500 outline-none"></div>
          <div><label class="text-gray-400 text-sm">Email</label><input id="profileEmail" type="email" class="bg-gray-900/50 border-2 border-gray-700 p-3 w-full mt-1 rounded-xl focus:border-indigo-500 outline-none" readonly></div>
          <button onclick="updateProfile()" class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white p-3 w-full rounded-xl font-bold shadow-lg">Update Profile</button>
          <p id="profileMsg" class="text-green-400 text-center text-sm"></p>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- DEPOSIT MODAL -->
<div id="depositModal" style="display:none" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50">
  <div class="dark-glass p-8 rounded-2xl w-96">
    <h3 class="text-2xl font-bold mb-4">Deposit <span id="depositCurrency"></span></h3>
    <input id="depositAmount" type="number" placeholder="Enter amount" class="bg-gray-900/50 border-2 border-gray-700 p-3 w-full mb-4 rounded-xl">
    <input id="depositUserId" type="hidden">
    <button onclick="confirmDeposit()" class="bg-green-600 text-white p-3 w-full rounded-xl font-bold mb-2">Confirm Deposit</button>
    <button onclick="closeDepositModal()" class="bg-gray-700 text-white p-3 w-full rounded-xl font-bold">Cancel</button>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDuET43YpKjt5XiLZ7oxD9FnLDVS8w3vsU",
  authDomain: "dami-project-936c4.firebaseapp.com",
  projectId: "dami-project-936c4",
  storageBucket: "dami-project-936c4.firebasestorage.app",
  messagingSenderId: "36489701559",
  appId: "1:36489701559:web:50ef7634655b6b36c48532"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

const ADMIN_EMAIL = "admin@test.com";
let currentUserData = null;
let allUsers = [];
let depositTargetUserId = null;
let depositCurrency = null;

// PAGE SWITCHERS
function showSignup(){ hideAll(); document.getElementById("signupPage").style.display="block"; }
function showLogin(){ hideAll(); document.getElementById("loginPage").style.display="block"; }
function showDashboard(){ hideAll(); document.getElementById("dashPage").style.display="block"; document.getElementById("dashboardContent").style.display="block"; }
function showProfile(){ hideAll(); document.getElementById("dashPage").style.display="block"; document.getElementById("profileContent").style.display="block"; loadProfile(); }
function hideAll(){ document.getElementById("loginPage").style.display="none"; document.getElementById("signupPage").style.display="none"; document.getElementById("dashPage").style.display="none"; document.getElementById("dashboardContent").style.display="none"; document.getElementById("profileContent").style.display="none"; }

function login() { auth.signInWithEmailAndPassword(document.getElementById("loginEmail").value, document.getElementById("loginPassword").value).catch(e => document.getElementById("loginErr").innerText = e.message) }
function signup() { auth.createUserWithEmailAndPassword(document.getElementById("signupEmail").value, document.getElementById("signupPassword").value).then(userCred => { db.collection("users").doc(userCred.user.uid).set({name: document.getElementById("signupName").value, email: document.getElementById("signupEmail").value, avatar: "", balance: {USD:0, USDT:0, BTC:0, ETH:0}, createdAt: new Date()}); alert("Account created!"); showLogin(); }).catch(e => document.getElementById("signupErr").innerText = e.message) }
function googlePopupLogin() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => document.getElementById("loginErr").innerText = e.message) }
function logout() { auth.signOut() }

function uploadAvatar(){ const file = document.getElementById("avatarUpload").files[0]; if(!file) return; const user = auth.currentUser; storage.ref(`avatars/${user.uid}`).put(file).then(() => storage.ref(`avatars/${user.uid}`).getDownloadURL()).then(url => { db.collection("users").doc(user.uid).update({avatar: url}); document.getElementById("profileAvatar").src = url; document.getElementById("navAvatar").src = url; }) }
function loadProfile(){ if(!currentUserData) return; document.getElementById("profileName").value = currentUserData.name || ""; document.getElementById("profileEmail").value = currentUserData.email || ""; document.getElementById("profileAvatar").src = currentUserData.avatar || `https://ui-avatars.com/api/?name=${currentUserData.name}&background=4F46E5&color=fff`; document.getElementById("navAvatar").src = currentUserData.avatar || `https://ui-avatars.com/api/?name=${currentUserData.name}&background=4F46E5&color=fff`; }
function updateProfile(){ db.collection("users").doc(auth.currentUser.uid).update({ name: document.getElementById("profileName").value }).then(() => { document.getElementById("profileMsg").innerText = "Profile updated!"; }) }

// NEW: DEPOSIT SYSTEM
function openDepositModal(currency, userId = null){
  depositCurrency = currency;
  depositTargetUserId = userId || auth.currentUser.uid; // if no userId, deposit to self
  document.getElementById("depositCurrency").innerText = currency;
  document.getElementById("depositModal").style.display = "flex";
}
function closeDepositModal(){ document.getElementById("depositModal").style.display = "none"; document.getElementById("depositAmount").value = ""; }

function confirmDeposit(){
  const amount = parseFloat(document.getElementById("depositAmount").value);
  if(amount <= 0) return alert("Enter valid amount");

  const userRef = db.collection("users").doc(depositTargetUserId);
  userRef.get().then(doc => {
    let bal = doc.data().balance || {USD:0, USDT:0, BTC:0, ETH:0};
    bal[depositCurrency] += amount;
    userRef.update({balance: bal}).then(() => {
      alert(`${amount} ${depositCurrency} deposited!`);
      closeDepositModal();
    })
  })
}

function renderUsers(users){
  const usersTable = document.getElementById("usersTable");
  usersTable.innerHTML = "";
  let count = 1;
  users.forEach(u => {
    const user = u.data;
    const bal = user.balance || {USD:0, USDT:0, BTC:0, ETH:0};
    const avatar = user.avatar || `https://ui-avatars.com/api/?name=${user.name}&background=4F46E5&color=fff`;
    usersTable.innerHTML += `<tr><td>${count}</td><td><div class="flex items-center gap-2"><img src="${avatar}" class="avatar">${user.name}</div></td><td>$${bal.USD.toFixed(2)}</td><td>${bal.USDT.toFixed(2)}</td><td>${bal.BTC.toFixed(4)}</td><td>${bal.ETH.toFixed(4)}</td><td><button onclick="openDepositModal('USD', '${u.id}')" class="bg-green-600 px-3 py-1 rounded-lg text-xs">Deposit</button></td></tr>`;
    count++;
  })
}
function searchUsers(){ const term = document.getElementById("searchInput").value.toLowerCase(); const filtered = allUsers.filter(u => u.data.name.toLowerCase().includes(term) || u.data.email.toLowerCase().includes(term)); renderUsers(filtered); }
function loadUsers(){ db.collection("users").orderBy("createdAt", "desc").onSnapshot(snapshot => { allUsers = []; snapshot.forEach(doc => allUsers.push({id: doc.id, data: doc.data()})); renderUsers(allUsers); }) }

auth.onAuthStateChanged(user => {
  if(user){
    db.collection("users").doc(user.uid).get().then(doc => {
      currentUserData = doc.data();
      document.getElementById("userEmail").innerText = currentUserData.email;
      // UPDATE BALANCE CARDS
      const bal = currentUserData.balance || {USD:0, USDT:0, BTC:0, ETH:0};
      document.getElementById("balUSD").innerText = `$${bal.USD.toFixed(2)}`;
      document.getElementById("balUSDT").innerText = bal.USDT.toFixed(2);
      document.getElementById("balBTC").innerText = bal.BTC.toFixed(4);
      document.getElementById("balETH").innerText = bal.ETH.toFixed(4);
      loadProfile();
    })
    // CREATE USER WITH BALANCE IF NEW
    db.collection("users").doc(user.uid).set({email: user.email, name: user.displayName || user.email.split('@')[0], avatar: user.photoURL || "", balance: {USD:0, USDT:0, BTC:0, ETH:0}, createdAt: new Date()}, {merge: true})
    showDashboard();
    if(user.email === ADMIN_EMAIL){ document.getElementById("adminContent").style.display="block"; document.getElementById("userContent").style.display="none"; loadUsers(); }
    else { document.getElementById("adminContent").style.display="none"; document.getElementById("userContent").style.display="block"; }
  } else { showLogin(); }
});
</script>
</body>
</html>
